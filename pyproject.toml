[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-layout-diff"
version = "0.18.0"
description = "Git snapshots and semantic diffs for Virtuoso analog layouts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
klayout = ["klayout>=0.30", "pillow>=9"]
verify = ["pytest>=7", "klayout>=0.30", "pillow>=9"]

[project.scripts]
layout-diff = "layoutdiff.cli:main"

[tool.setuptools.packages.find]
include = ["layoutdiff*", "klayout_plugin*"]
namespaces = false

[tool.setuptools.package-data]
"layoutdiff.eda.virtuoso" = ["skill/*.il"]
"layoutdiff.eda.klayout" = ["*.lym", "style.example.json"]
"layoutdiff.ui" = ["skill/*.il"]
"layoutdiff.data" = ["native_source.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
