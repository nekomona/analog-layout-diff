<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">See the change. Keep the context.</title>
  <desc id="desc">An original conceptual illustration of a synthetic IC layout comparison. Gray current-version geometry stays solid beneath breathing green addition and orange movement highlights. Dashed coral outlines show deletions without solid geometry beneath them. A Git timeline connects the two revisions.</desc>
  <style>
    .context-wires { fill: none; stroke: #637991; stroke-width: 14; stroke-linejoin: round; opacity: 1; }
    .context-devices { fill: #7d91aa; stroke: #9aafc6; stroke-width: 1.5; opacity: 1; }
  </style>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1426"/><stop offset="1" stop-color="#152b3b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8d1"/><stop offset="1" stop-color="#79c8ff"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#8bb3cf" stroke-opacity=".08"/></pattern>
    <g id="via"><rect x="-7" y="-7" width="14" height="14" rx="2"/><path d="M-3-3H3V3H-3Z" fill="#102337" stroke="none"/></g>
  </defs>
  <rect width="1440" height="440" rx="22" fill="url(#bg)"/>
  <rect x="665" y="25" width="750" height="390" rx="16" fill="url(#grid)"/>
  <path d="M56 53H128" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <text x="56" y="91" fill="#75e6d1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="3">GIT FOR ANALOG LAYOUT CHANGES</text>
  <g fill="#f1f6fc" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">
    <text x="53" y="162">See the change.</text><text x="53" y="223">Keep the context.</text>
  </g>
  <g fill="#afc0d4" font-family="Arial,Helvetica,sans-serif" font-size="20">
    <text x="56" y="269">Geometry. Connectivity. Properties.</text>
    <text x="56" y="300">A design history you can inspect.</text>
  </g>
  <rect x="56" y="345" width="523" height="43" rx="10" fill="#183244" stroke="#315268"/>
  <text x="76" y="372" fill="#d8edf4" font-family="Arial,Helvetica,sans-serif" font-size="16">SAVE &amp; COMMIT</text>
  <path d="M242 366H278M270 360L278 366L270 372" stroke="#75e6d1" stroke-width="2" fill="none"/>
  <text x="295" y="372" fill="#d8edf4" font-family="Arial,Helvetica,sans-serif" font-size="16">HISTORY</text>
  <path d="M383 366H419M411 360L419 366L411 372" stroke="#75e6d1" stroke-width="2" fill="none"/>
  <text x="436" y="372" fill="#d8edf4" font-family="Arial,Helvetica,sans-serif" font-size="16">REVIEW</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="652" y="53" width="716" height="316" rx="15" fill="#0a1424" stroke="#334d65"/>
    <path d="M652 98H1368" stroke="#334d65"/>
    <circle cx="677" cy="76" r="4" fill="#75e6d1"/>
    <text x="692" y="81" fill="#d1e0ee" font-size="14">LAYOUT REVIEW</text>
